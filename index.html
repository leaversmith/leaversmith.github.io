<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Leaver-Smith</title>
  <style>
    @font-face {
      font-family: garamond;
      src: url("https://ols.wtf/rpgs/racheek/docs/garamond.ttf");
    }

    @font-face {
      font-family: garamondi;
      src: url("https://ols.wtf/rpgs/racheek/docs/garamondi.ttf");
    }

    :root {
      --fg: #294530;
      --bg: #faf0e6;
      --accent: #7B0323;
      --muted: rgba(41, 69, 48, 0.62);
      --rule: rgba(41, 69, 48, 0.22);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: garamond, Garamond, Georgia, serif;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 48px 24px;
    }

    main {
      width: min(720px, 100%);
      text-align: center;
    }

    header { margin-bottom: 48px; }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 10vw, 5rem);
      font-weight: normal;
      letter-spacing: 0.04em;
      line-height: 1;
    }

    .tagline {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 18px 0 0;
      color: var(--muted);
      font-family: garamondi, Garamond, Georgia, serif;
      font-size: 1.15rem;
    }

    .tagline::before,
    .tagline::after {
      width: 48px;
      height: 1px;
      background: var(--accent);
      opacity: 0.45;
      content: "";
    }

    nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    a.card {
      display: block;
      padding: 32px 24px;
      border: 1px solid var(--rule);
      color: inherit;
      text-decoration: none;
      transition: border-color 120ms ease, color 120ms ease;
    }

    a.card:hover,
    a.card:focus-visible {
      border-color: var(--accent);
      color: var(--accent);
    }

    a.card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    a.card h2 {
      margin: 0 0 8px;
      font-size: 1.7rem;
      font-weight: normal;
      letter-spacing: 0.04em;
    }

    a.card p {
      margin: 0;
      color: var(--muted);
      font-family: garamondi, Garamond, Georgia, serif;
      font-size: 1.05rem;
      line-height: 1.4;
    }

    a.card:hover p,
    a.card:focus-visible p { color: var(--accent); }

    @media (max-width: 560px) {
      nav { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Leaver-Smith</h1>
      <p class="tagline">The household pages</p>
    </header>
    <nav aria-label="Household pages">
      <a class="card" href="https://leaversmith.com/schedule/">
        <h2>Schedule</h2>
        <p>The week ahead</p>
      </a>
      <a class="card" href="https://leaversmith.com/places/">
        <h2>Places</h2>
        <p>Travels, past and planned</p>
      </a>
    </nav>
  </main>
</body>
</html>
